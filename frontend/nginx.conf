server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hash-based routing means no rewrites are strictly needed; this keeps deep links safe anyway.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted assets can be cached hard; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
